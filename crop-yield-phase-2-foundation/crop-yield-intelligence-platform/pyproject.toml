[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-yield-intelligence-platform"
version = "0.1.0"
description = "End-to-end crop-yield prediction and deployment portfolio project"
requires-python = ">=3.11"
authors = [
  { name = "Abubakar Mamudu Alutiba", email = "Alutiba04@gmail.com" }
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
